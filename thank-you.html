<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thank You for Your Submission</title>
  <style>
    *, *:before, *:after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .ty-card {
      background: #FFF;
      border: 1px solid #ddd;
      border-radius: 4px;
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
    }
    .ty-check {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ty-check svg { width: 32px; height: 32px; stroke: #fff; }
    .ty-card h1 {
      font-size: 1.6em;
      margin: 0 0 12px;
      line-height: 1.3;
    }
    .ty-card p {
      font-size: 1.05em;
      line-height: 1.5;
      margin: 0 0 24px;
      color: #555;
    }
    .ty-btn {
      display: inline-block;
      padding: 14px 24px;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 1em;
    }
    .ty-btn:hover { background: #000; }
  </style>
</head>
<body>
  <main class="ty-card">
    <div class="ty-check">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Thank You for Your Submission</h1>
    <p>Someone will be in touch with you soon.</p>
    <a class="ty-btn" href="https://www.goldenguardian.org">Return to Home</a>
  </main>
</body>
</html>
